name: Build Codeg Portable Windows x64

on:
  push:
    branches:
      - plugin-dev
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ""
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Base-selection model (2026-08-12): the plugin-dev native trees are NOT
      # the patch target. The single source of truth is newplugin/BASE, which
      # pins the exact upstream commit (v0.24.0) the archive was re-anchored
      # against. This step reconstructs the COMPLETE upstream tree at that SHA,
      # then restores ONLY the plugin-dev custom layer CI needs (patch archive +
      # the custom workflow files). It is NOT a path-scoped overlay: git fully
      # materializes the upstream tree, so upstream deletions/renames cannot
      # leave stale old-base files behind.
      #
      # Resulting workspace:  pinned upstream base (newplugin/BASE)
      #                       + plugin-dev custom layer (newplugin/ + workflows)
      #                       + 104 patches (applied below, unchanged).
      - name: Reconstruct engine from pinned upstream base (newplugin/BASE)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 1) Capture the exact plugin-dev commit we were checked out at
          #    BEFORE detaching. Never resolve the plugin-dev branch by name
          #    after detaching (it could move between runs).
          $pluginDevSha = (git rev-parse HEAD).Trim()
          if (-not $pluginDevSha) { throw "Could not resolve plugin-dev HEAD SHA" }
          Write-Host "plugin-dev captured at: $pluginDevSha"
          # 2) Read the pinned upstream base from newplugin/BASE.
          $base = Get-Content newplugin/BASE | Where-Object { $_ -match '^[a-z]+=' }
          $up = (($base | Where-Object { $_ -like 'upstream=*' }) -replace '^upstream=','').Trim()
          $ref = (($base | Where-Object { $_ -like 'ref=*' })     -replace '^ref=','').Trim()
          $sha = (($base | Where-Object { $_ -like 'sha=*' })     -replace '^sha=','').Trim()
          if (-not $up -or -not $ref -or -not $sha) { throw "newplugin/BASE is incomplete" }
          Write-Host "base: $up $ref"
          # 3) Fetch the pinned upstream tag and verify it resolves to the
          #    immutable SHA declared in newplugin/BASE.
          git fetch "$up" "refs/tags/${ref}:refs/tags/${ref}"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed for $ref" }
          $resolved = (git rev-parse "refs/tags/$ref").Trim()
          if ($resolved -ne $sha) { throw "BASE SHA mismatch: pinned $sha != resolved $resolved" }
          Write-Host "base SHA verified: $resolved"
          # 4) Reconstruct the COMPLETE upstream tree at the pinned SHA.
          git checkout --detach $sha
          if ($LASTEXITCODE -ne 0) { throw "git checkout --detach $sha failed" }
          # 5) Restore ONLY the CI-required plugin-dev custom layer from the
          #    captured plugin-dev SHA (additive re-application from git objects).
          git checkout $pluginDevSha -- newplugin/
          git checkout $pluginDevSha -- .github/workflows/codeg-portable-win64-custom.yml `
                                     .github/workflows/test-patched.yml
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore plugin-dev custom layer" }
          Write-Host "Reconstructed upstream $resolved + plugin-dev custom layer"
          git status --porcelain

      # Patch-archive model (2026-08-07): custom features are archived as
      # apply-on-demand patches under newplugin/patches/ and applied here in
      # dependency order:
      #   1) 54 plain/perchat/channelmsg patches (`.patch`)
      #   2) 16 task-accept patches             (`.accept.patch`)
      #   3) 21 launch-target patches           (`.launch.patch`)
      #   4) 13 custom-workflows tab patches    (`.customtab.patch`)
      # Within each group patches are applied alphabetically. This build
      # therefore ships WITH all custom features.
      - name: Apply custom feature patches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patchDir = "newplugin/patches"
          $groups = @(
            @{ Name = "auto-approve"; Pattern = '\.(accept|launch|customtab)\.patch$'; Exclude = $true },
            @{ Name = "task-accept";  Pattern = '\.accept\.patch$' },
            @{ Name = "launch-target"; Pattern = '\.launch\.patch$' },
            @{ Name = "custom-tab";   Pattern = '\.customtab\.patch$' }
          )
          foreach ($group in $groups) {
            $files = Get-ChildItem -Path $patchDir -File -Filter "*.patch" |
              Where-Object {
                if ($group.Exclude) {
                  $_.Name -notmatch $group.Pattern
                } else {
                  $_.Name -match $group.Pattern
                }
              } |
              Sort-Object Name
            if ($files.Count -eq 0) {
              Write-Output "=== Group $($group.Name): 0 patches matched - skipping (intentionally empty group) ==="
              continue
            }
            Write-Output "=== Applying $($group.Name) ($($files.Count) patches) ==="
            foreach ($file in $files) {
              Write-Output "Applying $($file.Name)"
              git apply "$($file.FullName)"
              if ($LASTEXITCODE -ne 0) {
                throw "Patch $($file.Name) failed to apply (see output above). Aborting so the failure is not silent."
              }
            }
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: win64-desktop

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        shell: pwsh
        run: pnpm build

      - name: Pre-build and stage codeg-mcp sidecar
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --release --bin codeg-mcp --no-default-features --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          # Triple-suffixed name is what tauri.conf.json externalBin + build.rs expect.
          Copy-Item "target/x86_64-pc-windows-msvc/release/codeg-mcp.exe" `
            "binaries/codeg-mcp-x86_64-pc-windows-msvc.exe" -Force

      - name: Patch tauri.conf.json (skip installer, skip beforeBuildCommand)
        shell: pwsh
        run: |
          $config = "src-tauri/tauri.conf.json"
          $content = Get-Content $config -Raw
          $content = $content -replace '"targets":\s*"all"', '"targets": []'
          $content = $content -replace '"beforeBuildCommand":\s*"pnpm tauri:before-build"', '"beforeBuildCommand": ""'
          $content | Out-File $config -Encoding utf8 -NoNewline

      - name: Build desktop binary with Tauri (embeds frontend)
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Assemble portable directory
        shell: pwsh
        run: |
          $dir = "dist/codeg-portable-win64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"

          Copy-Item -Path "$releaseDir/codeg.exe" -Destination $dir -Force
          Copy-Item -Path "src-tauri/binaries/codeg-mcp-x86_64-pc-windows-msvc.exe" `
            -Destination "$dir/codeg-mcp.exe" -Force

          if (Test-Path "out") {
            New-Item -ItemType Directory -Force -Path "$dir/web" | Out-Null
            Copy-Item -Recurse -Path "out/*" -Destination "$dir/web" -Force
          }

          Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $dir -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeg-portable-win64
          path: dist/codeg-portable-win64/*
          retention-days: 14
