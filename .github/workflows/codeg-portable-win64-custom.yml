name: Build Codeg Portable Windows x64

on:
  push:
    branches:
      - plugin-dev
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ""
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Patch-archive model (2026-08-07): the tree is 100% pure origin/main;
      # custom features are archived as apply-on-demand patches under
      # newplugin/patches/ and applied here in dependency order:
      #   1) 17 auto-approve patches        (`.patch`)
      #   2) 9  task-accept patches         (`.accept.patch`)
      #   3) 20 launch-target patches       (`.launch.patch`)
      #   4) 13 custom-workflows tab patches (`.customtab.patch`)
      # Within each group patches are applied alphabetically. This build
      # therefore ships WITH all custom features.
      - name: Apply custom feature patches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patchDir = "newplugin/patches"
          $groups = @(
            @{ Name = "auto-approve"; Pattern = '\.(accept|launch|customtab)\.patch$'; Exclude = $true },
            @{ Name = "task-accept";  Pattern = '\.accept\.patch$' },
            @{ Name = "launch-target"; Pattern = '\.launch\.patch$' },
            @{ Name = "custom-tab";   Pattern = '\.customtab\.patch$' }
          )
          foreach ($group in $groups) {
            $files = Get-ChildItem -Path $patchDir -File -Filter "*.patch" |
              Where-Object {
                if ($group.Exclude) {
                  $_.Name -notmatch $group.Pattern
                } else {
                  $_.Name -match $group.Pattern
                }
              } |
              Sort-Object Name
            if ($files.Count -eq 0) {
              throw "No patches matched group $($group.Name)"
            }
            Write-Output "=== Applying $($group.Name) ($($files.Count) patches) ==="
            foreach ($file in $files) {
              Write-Output "Applying $($file.Name)"
              git apply "$($file.FullName)"
              if ($LASTEXITCODE -ne 0) {
                throw "Patch $($file.Name) failed to apply (see output above). Aborting so the failure is not silent."
              }
            }
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: win64-desktop

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        shell: pwsh
        run: pnpm build

      - name: Pre-build and stage codeg-mcp sidecar
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --release --bin codeg-mcp --no-default-features --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          # Triple-suffixed name is what tauri.conf.json externalBin + build.rs expect.
          Copy-Item "target/x86_64-pc-windows-msvc/release/codeg-mcp.exe" `
            "binaries/codeg-mcp-x86_64-pc-windows-msvc.exe" -Force

      - name: Patch tauri.conf.json (skip installer, skip beforeBuildCommand)
        shell: pwsh
        run: |
          $config = "src-tauri/tauri.conf.json"
          $content = Get-Content $config -Raw
          $content = $content -replace '"targets":\s*"all"', '"targets": []'
          $content = $content -replace '"beforeBuildCommand":\s*"pnpm tauri:before-build"', '"beforeBuildCommand": ""'
          $content | Out-File $config -Encoding utf8 -NoNewline

      - name: Build desktop binary with Tauri (embeds frontend)
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Assemble portable directory
        shell: pwsh
        run: |
          $dir = "dist/codeg-portable-win64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"

          Copy-Item -Path "$releaseDir/codeg.exe" -Destination $dir -Force
          Copy-Item -Path "src-tauri/binaries/codeg-mcp-x86_64-pc-windows-msvc.exe" -Destination $dir -Force

          if (Test-Path "out") {
            New-Item -ItemType Directory -Force -Path "$dir/web" | Out-Null
            Copy-Item -Recurse -Path "out/*" -Destination "$dir/web" -Force
          }

          Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $dir -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeg-portable-win64
          path: dist/codeg-portable-win64/*
          retention-days: 14
