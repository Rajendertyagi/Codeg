name: Build Codeg Portable Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: win64-desktop

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build codeg-mcp sidecar
        run: pnpm tauri:prepare-sidecars --target x86_64-pc-windows-msvc

      - name: Verify sidecar
        shell: bash
        run: |
          file="src-tauri/binaries/codeg-mcp-x86_64-pc-windows-msvc.exe"
          if [ ! -f "$file" ]; then
            echo "FATAL: sidecar $file missing"
            exit 1
          fi
          ls -la "$file"

      - name: Build desktop binary
        working-directory: src-tauri
        run: cargo build --release --bin codeg --features tauri-runtime --target x86_64-pc-windows-msvc
        env:
          CODEG_SKIP_SIDECAR: "1"

      - name: Create portable launcher
        shell: pwsh
        run: |
          @"
          @echo off
          cd /d "%~dp0"
          set "CODEG_HOME=%~dp0data"
          set "CODEG_DATA_DIR=%~dp0data"
          set "CODEG_STATIC_DIR=%~dp0web"
          start "" "%~dp0codeg.exe"
          "@ | Out-File -FilePath start-codeg-portable.bat -Encoding ascii

      - name: Package portable zip
        shell: pwsh
        run: |
          $artifact = "codeg-portable-win64"
          $dir = "dist/$artifact"
          New-Item -ItemType Directory -Force -Path $dir

          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/codeg.exe" $dir/
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/codeg-mcp.exe" $dir/
          Copy-Item -Recurse "out" "$dir/web"
          Copy-Item "start-codeg-portable.bat" $dir/
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dir

          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$artifact.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeg-portable-win64
          path: dist/codeg-portable-win64.zip
