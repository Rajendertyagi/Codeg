name: Build Codeg Portable Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ""
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: win64-desktop

      - name: Pre-build and stage codeg-mcp sidecar
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --release --bin codeg-mcp --no-default-features --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/codeg-mcp.exe" `
            "binaries/codeg-mcp-x86_64-pc-windows-msvc.exe" -Force

      - name: Build with Tauri (embeds frontend, produces MSI)
        shell: pwsh
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles msi

      - name: Create portable launcher
        shell: pwsh
        run: |
          $bat = @'
          @echo off
          cd /d "%~dp0"
          set "CODEG_HOME=%~dp0data"
          set "CODEG_DATA_DIR=%~dp0data"
          set "CODEG_STATIC_DIR=%~dp0web"
          start "" "%~dp0codeg.exe"
          '@
          $bat | Out-File -FilePath start-codeg-portable.bat -Encoding ascii

      - name: Assemble portable directory
        shell: pwsh
        run: |
          $dir = "dist/codeg-portable-win64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"

          Copy-Item -Path "$releaseDir/codeg.exe" -Destination $dir -Force
          Copy-Item -Path "src-tauri/binaries/codeg-mcp-x86_64-pc-windows-msvc.exe" -Destination $dir -Force

          if (Test-Path "out") {
            New-Item -ItemType Directory -Force -Path "$dir/web" | Out-Null
            Copy-Item -Recurse -Path "out/*" -Destination "$dir/web" -Force
          }

          Copy-Item -Path "start-codeg-portable.bat" -Destination $dir -Force

          Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $dir -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeg-portable-win64
          path: dist/codeg-portable-win64/*
          retention-days: 14
