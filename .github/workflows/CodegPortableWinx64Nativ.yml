name: Build Codeg Native Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ""
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - name: Checkout upstream codeg (original project, no fork code)
        uses: actions/checkout@v7
        with:
          repository: xintaofei/codeg
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: win64-desktop

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        shell: pwsh
        run: pnpm build

      # Both externalBin entries are feature-gated bin targets
      # (required-features = ["mcp-bin"] / ["computer-helper"]), so they need
      # --no-default-features --features mcp-bin,computer-helper. This replaces
      # the beforeBuildCommand we blank out below.
      - name: Build and stage sidecars
        shell: pwsh
        run: node src-tauri/scripts/prepare-sidecars.mjs --target x86_64-pc-windows-msvc

      - name: Verify staged sidecars
        shell: pwsh
        run: |
          $missing = @()
          foreach ($b in @("codeg-mcp", "codeg-computer-helper")) {
            $p = "src-tauri/binaries/$b-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path $p)) { $missing += $p }
          }
          if ($missing.Count -gt 0) { throw "Missing sidecar(s): $($missing -join ', ')" }

      - name: Patch tauri.conf.json (skip installer, skip beforeBuildCommand)
        shell: pwsh
        run: |
          $config = "src-tauri/tauri.conf.json"
          $content = Get-Content $config -Raw
          $content = $content -replace '"targets":\s*"all"', '"targets": []'
          $content = $content -replace '"beforeBuildCommand":\s*"pnpm tauri:before-build"', '"beforeBuildCommand": ""'
          $content | Out-File $config -Encoding utf8 -NoNewline

      - name: Build desktop binary with Tauri (embeds frontend)
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Assemble portable directory
        shell: pwsh
        run: |
          $dir = "dist/codeg-portable-win64"
          $triple = "x86_64-pc-windows-msvc"
          $releaseDir = "src-tauri/target/$triple/release"

          if (-not (Test-Path "$releaseDir/codeg.exe")) {
            throw "codeg.exe missing from $releaseDir"
          }
          if (-not (Test-Path "out/index.html")) {
            throw "out/index.html missing - the Next static export produced nothing (check next.config output: 'export')"
          }

          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          Copy-Item -Path "$releaseDir/codeg.exe" -Destination $dir -Force

          # Rename on copy: codeg resolves BOTH companions by exe-sibling lookup
          # with these exact names, not via Tauri's sidecar resolver
          # (locate_codeg_mcp_binary / locate_helper_binary in
          # src-tauri/src/acp/connection.rs and src/computer/local.rs).
          # The target-triple suffix is only what externalBin/bundling wants.
          Copy-Item -Path "src-tauri/binaries/codeg-mcp-$triple.exe" `
            -Destination "$dir/codeg-mcp.exe" -Force
          Copy-Item -Path "src-tauri/binaries/codeg-computer-helper-$triple.exe" `
            -Destination "$dir/codeg-computer-helper.exe" -Force

          # web/ next to the exe: find_static_dir_tauri() reads
          # resource_dir()/web/index.html, and the fallback is CWD-relative.
          New-Item -ItemType Directory -Force -Path "$dir/web" | Out-Null
          Get-ChildItem -Path "out" -Force | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "$dir/web" -Recurse -Force
          }

          Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $dir -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeg-native-win64
          path: dist/codeg-portable-win64/*
          retention-days: 14
